apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: progree
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: progree-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: production
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: redis
          envFrom:
            - secretRef:
                name: redis-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: progree
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 5000
